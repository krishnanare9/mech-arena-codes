name: Optimize MechNova Images

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "mechnova.css"
      - "promo-codes-2026.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Convert referenced PNGs and update local references
        run: python scripts/optimize_images.py
