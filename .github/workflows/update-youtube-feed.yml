```yaml
name: Update MechNova YouTube Videos

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Fetch latest public uploads
        run: python scripts/update_youtube_feed.py

      - name: Commit updated feed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-videos.json
          if ! git diff --cached --quiet; then
            git commit -m "Update latest YouTube uploads"
            git push
          else
            echo "No feed changes to commit"
          fi
```
